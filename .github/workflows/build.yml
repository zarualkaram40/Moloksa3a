name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14
      - run: unzip -o Moloksa3aMenu-source.zip
      - run: cd Moloksa3aMenu && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Moloksa3aMenu
          path: Moloksa3aMenu/build/libs/*.jar
